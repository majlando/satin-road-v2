server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression: the single biggest transfer-size win (Part 20 measures it).
  # nginx defaults to gzip_comp_level 1. Level 6 makes the bundle noticeably
  # smaller for a few milliseconds of CPU on a file that is then cached for a
  # year, so the trade is worth it.
  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json
             application/xml image/svg+xml font/woff2;

  # Everything API-shaped goes to the .NET container. Same origin, so no CORS.
  location ~ ^/(api|swagger|openapi|health)(/|$) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed filenames, so they can be cached forever.
  location ~* \.(js|css|svg|webp|avif|woff2)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # The shell must never be stale, or it would point at old asset hashes.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: unknown paths render the React app.
  location / {
    try_files $uri /index.html;
  }
}